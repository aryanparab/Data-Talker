services:
  - type: web
    name: data-talker-demo
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DAILY_MODEL_CALLS
        value: "100"
